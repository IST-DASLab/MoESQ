# Paired-4:8 + NVFP4 W4A4, activation-aware Gumbel refinement.

model:
  name: Qwen/Qwen3-30B-A3B  # snapshot 4c446470ba0aec43e22ac1128f9ffd915f338ba3
  device: cuda
  dtype: bfloat16

data:
  dataset_name: open_thoughts
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128

compression:
  prunen: 4
  prunem: 8
  quant_type: nvfp4
  groupsize: 16
  learn_weight_values: true
  fake_quantize_activations: true   # NVFP4 act fake-quant in forward

init:
  method: gptq
  wbits: 4
  nsamples: 512
  sym: true
  trits: false
  percdamp: 0.01
  blocksize: 128
  static_groups: false

refine:
  enabled: true
  start_layer: 0
  self_attn: false
  num_epochs: 5
  device_microbatch_size: 4
  warmup_steps: 0
  lr_decay_type: cosine
  scheduler_min_lr: 0.1
  masks_lr: 0.0002
  weights_lr: 5.0e-05
  weight_decay: 1.0
  lion_betas: [0.9, 0.95]
  temperature: [2.0, 0.05]
  scale: [100, 500]
  strength: 4
  std: 0.01
  logits_dtype: bfloat16

training:
  checkpoint_dir: checkpoints/
  log_dir: logs
  eval_baseline: false
  ppl_eval_every_n_layers: 6
  meta_init_std: 0.02
  act_cache_dir: act_cache
  act_cache_mmap_threshold_gb: 2.0

wandb: true

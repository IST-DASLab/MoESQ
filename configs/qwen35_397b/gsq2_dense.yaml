# Qwen3.5-397B-A17B, GSQ dense 2-bit (no sparsity) reference.
# Multi-GPU expert-parallel run: launch with scripts/slurm.sh.

model:
  name: Qwen/Qwen3.5-397B-A17B  # snapshot 8472618112abcbd45acbcdc58436aff4233c23f7
  device: cuda
  dtype: bfloat16
  dummy: false

data:
  dataset_name: mixed
  num_samples: 8192
  val_samples: 128
  batch_size: 64
  max_length: 4096
  num_workers: 8
  seed: 0
  shuffle_seed: 1234
  shuffle_buffer_size: 100000
  open_thoughts_max_samples: 10000
  mixed_source_weights: [0.1, 0.45, 0.45]

compression:
  prunen: 0
  prunem: 0
  quant_type: gsq
  groupsize: 128
  learn_weight_values: false
  fake_quantize_activations: false

init:
  method: gptq
  wbits: 2
  nsamples: 512
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  static_groups: false
  hessian_chunk_tokens: 65536

refine:
  enabled: true
  start_layer: 0
  self_attn: false
  num_epochs: 10
  device_microbatch_size: 8
  warmup_steps: 0
  lr_decay_type: cosine
  scheduler_min_lr: 0.1
  masks_lr: 0.0002                 # unused by GSQ (no mask); kept for the shared code path
  logits_lr: 0.0002                # paper Table 8 (Kimi, 2-bit): grid-assignment logits
  group_scales_lr: 0.00001         # paper Table 8: group scales, 20x slower than logits
  weights_lr: 0.0001               # unused by GSQ (no master weight); kept for parity
  weight_decay: 1
  lion_betas: [0.9, 0.95]
  temperature: [2, 0.05]
  scale: [100, 500]
  strength: 6                      # paper alpha for 2/3-bit (Tables 7/8)
  std: 0.01
  logits_dtype: bfloat16

training:
  checkpoint_dir: checkpoints/
  log_dir: logs
  eval_baseline: false
  ppl_eval_every_n_layers: 1000
  meta_init_std: 0.02
  act_cache_dir: act_cache_gsq2
  act_cache_mmap_threshold_gb: 2

eval:
  default_tasks: gsm8k,arc_challenge,arc_easy,winogrande,piqa
  ppl_seed: 1234
  ppl_max_samples: 1000
  test_size: 0.2
  split_seed: 42

distributed:
  timeout_hours: 4.0

wandb:
  enabled: true
  project: moe-sq
  entity: ''

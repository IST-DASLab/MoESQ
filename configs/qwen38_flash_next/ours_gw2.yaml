# Qwen3.8-Flash-Next, ours: paired-4:8 NVFP4 W4A4, gate-weighted refinement p=2 (Qwen3.5 settings, untuned).
# Multi-GPU expert-parallel run: launch with scripts/slurm.sh.

model:
  name: Qwen/Qwen3.8-Flash-Next
  device: cuda
  dtype: bfloat16
  dummy: false

data:
  dataset_name: mixed
  num_samples: 8192
  val_samples: 128
  batch_size: 64
  max_length: 4096
  num_workers: 8
  seed: 0
  shuffle_seed: 1234
  shuffle_buffer_size: 100000
  open_thoughts_max_samples: 10000
  mixed_source_weights: [0.1, 0.45, 0.45]

compression:
  prunen: 4
  prunem: 8
  quant_type: nvfp4
  groupsize: 16
  learn_weight_values: true
  fake_quantize_activations: true

init:
  method: gptq
  wbits: 4
  nsamples: 512
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  static_groups: false
  hessian_chunk_tokens: 65536

refine:
  enabled: true
  start_layer: 0
  self_attn: false
  num_epochs: 10
  device_microbatch_size: 8
  warmup_steps: 0
  lr_decay_type: cosine
  scheduler_min_lr: 0.1
  masks_lr: 2.0e-4
  weights_lr: 2.5e-5
  weight_decay: 1
  lion_betas: [0.9, 0.95]
  temperature: [2.0, 0.05]
  scale: [100, 500]
  strength: 4
  std: 0.01
  logits_dtype: bfloat16
  gate_weight_exponent: 2
  divergence_warn_ratio: 1.5

training:
  checkpoint_dir: checkpoints/
  log_dir: logs
  eval_baseline: false
  ppl_eval_every_n_layers: 1000
  meta_init_std: 0.02
  act_cache_dir: act_cache
  act_cache_mmap_threshold_gb: 2.0

distributed:
  timeout_hours: 4.0

wandb:
  enabled: true
  project: moe-sq
  entity: ''
